
name: dbt CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt
        run: |
          pip install dbt-postgres

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          echo "sales_profile:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      user: postgres
      password: postgres
      port: 5432
      dbname: sales_db
      schema: public" > ~/.dbt/profiles.yml

      - name: Run dbt models
        run: dbt run --project-dir src/modeling

      - name: Run dbt tests
        run: dbt test --project-dir src/modeling
